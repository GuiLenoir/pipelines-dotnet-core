parameters:

- name: environmentName
  type: string

- name: color
  type: string
  default: "3447003"

steps:

- powershell: |

    # ========================================================
    # DADOS DOS GALOS
    # ========================================================

    $galo1Nome = "$(galo1Nome)"
    $galo1Raridade = "$(galo1Raridade)"
    $galo1Hp = [int]"$(galo1Hp)"
    $galo1Ataque = [int]"$(galo1Ataque)"
    $galo1Defesa = [int]"$(galo1Defesa)"
    $galo1Velocidade = [int]"$(galo1Velocidade)"

    $galo2Nome = "$(galo2Nome)"
    $galo2Raridade = "$(galo2Raridade)"
    $galo2Hp = [int]"$(galo2Hp)"
    $galo2Ataque = [int]"$(galo2Ataque)"
    $galo2Defesa = [int]"$(galo2Defesa)"
    $galo2Velocidade = [int]"$(galo2Velocidade)"

    # ========================================================
    # VIDA INICIAL
    # ========================================================

    $hp1 = $galo1Hp
    $hp2 = $galo2Hp

    $round = 1
    $rounds = @()

    # ========================================================
    # BATALHA
    # ========================================================

    while ($hp1 -gt 0 -and $hp2 -gt 0 -and $round -le 20) {

        Write-Host ""
        Write-Host "========== ROUND $round =========="

        if ($galo1Velocidade -ge $galo2Velocidade) {
            $primeiro = 1
        }
        else {
            $primeiro = 2
        }

        # ====================================================
        # GALO 1 ATACA PRIMEIRO
        # ====================================================

        if ($primeiro -eq 1) {

            $dano = $galo1Ataque - [math]::Floor($galo2Defesa / 2)

            if ($dano -lt 1) {
                $dano = 1
            }

            $critico = Get-Random -Minimum 1 -Maximum 101

            if ($critico -le 20) {

                $dano = $dano * 2

                $rounds += "🥊 Round $round — $galo1Nome acertou um 💥 CRÍTICO causando $dano de dano!"

            }
            else {

                $rounds += "🥊 Round $round — $galo1Nome causou $dano de dano!"
            }

            $hp2 -= $dano

            Write-Host "$galo1Nome causou $dano de dano"

            if ($hp2 -le 0) {
                break
            }

            # Contra-ataque

            $dano = $galo2Ataque - [math]::Floor($galo1Defesa / 2)

            if ($dano -lt 1) {
                $dano = 1
            }

            $critico = Get-Random -Minimum 1 -Maximum 101

            if ($critico -le 20) {

                $dano = $dano * 2

                $rounds += "🥊 Round $round — $galo2Nome respondeu com 💥 CRÍTICO causando $dano de dano!"

            }
            else {

                $rounds += "🥊 Round $round — $galo2Nome causou $dano de dano!"
            }

            $hp1 -= $dano

            Write-Host "$galo2Nome causou $dano de dano"
        }

        # ====================================================
        # GALO 2 ATACA PRIMEIRO
        # ====================================================

        else {

            $dano = $galo2Ataque - [math]::Floor($galo1Defesa / 2)

            if ($dano -lt 1) {
                $dano = 1
            }

            $critico = Get-Random -Minimum 1 -Maximum 101

            if ($critico -le 20) {

                $dano = $dano * 2

                $rounds += "🥊 Round $round — $galo2Nome acertou um 💥 CRÍTICO causando $dano de dano!"

            }
            else {

                $rounds += "🥊 Round $round — $galo2Nome causou $dano de dano!"
            }

            $hp1 -= $dano

            Write-Host "$galo2Nome causou $dano de dano"

            if ($hp1 -le 0) {
                break
            }

            # Contra-ataque

            $dano = $galo1Ataque - [math]::Floor($galo2Defesa / 2)

            if ($dano -lt 1) {
                $dano = 1
            }

            $critico = Get-Random -Minimum 1 -Maximum 101

            if ($critico -le 20) {

                $dano = $dano * 2

                $rounds += "🥊 Round $round — $galo1Nome respondeu com 💥 CRÍTICO causando $dano de dano!"

            }
            else {

                $rounds += "🥊 Round $round — $galo1Nome causou $dano de dano!"
            }

            $hp2 -= $dano

            Write-Host "$galo1Nome causou $dano de dano"
        }

        $round++
    }

    # ========================================================
    # DEFINIR VENCEDOR
    # ========================================================

    if ($hp1 -gt 0 -and $hp2 -le 0) {

        $winner = $galo1Nome
        $winnerRarity = $galo1Raridade
        $winnerHp = $hp1

    }
    elseif ($hp2 -gt 0 -and $hp1 -le 0) {

        $winner = $galo2Nome
        $winnerRarity = $galo2Raridade
        $winnerHp = $hp2

    }
    else {

        if ($hp1 -ge $hp2) {

            $winner = $galo1Nome
            $winnerRarity = $galo1Raridade
            $winnerHp = $hp1

        }
        else {

            $winner = $galo2Nome
            $winnerRarity = $galo2Raridade
            $winnerHp = $hp2
        }
    }

    # ========================================================
    # LOG
    # ========================================================

    Write-Host ""
    Write-Host "========================================"
    Write-Host "              VENCEDOR"
    Write-Host "========================================"
    Write-Host ""
    Write-Host "$winner"
    Write-Host "Raridade: $winnerRarity"
    Write-Host "HP restante: $winnerHp"
    Write-Host ""

    # ========================================================
    # ROUNDS
    # ========================================================

    $battleText = ""

    foreach ($item in $rounds) {
        $battleText += "$item`n"
    }

    # ========================================================
    # DISCORD
    # ========================================================

    $message = @"
🎰 **ROLETA DA RINHA — ${{ parameters.environmentName }}**

━━━━━━━━━━━━━━━━━━━━━━━━━━━━

🐓 **$galo1Nome**
⭐ Raridade: **$galo1Raridade**
❤️ HP: **$galo1Hp**
⚔️ ATK: **$galo1Ataque**
🛡️ DEF: **$galo1Defesa**
💨 SPD: **$galo1Velocidade**

                🆚

🐓 **$galo2Nome**
⭐ Raridade: **$galo2Raridade**
❤️ HP: **$galo2Hp**
⚔️ ATK: **$galo2Ataque**
🛡️ DEF: **$galo2Defesa**
💨 SPD: **$galo2Velocidade**

━━━━━━━━━━━━━━━━━━━━━━━━━━━━

⚔️ **A LUTA COMEÇOU!**

$battleText

━━━━━━━━━━━━━━━━━━━━━━━━━━━━

🏆 **VENCEDOR**

🐓 **$winner**

⭐ Raridade: **$winnerRarity**
❤️ HP restante: **$winnerHp**

🎉 Fim da luta!
"@

    $body = @{
        content = $message
    } | ConvertTo-Json

    Invoke-RestMethod `
        -Uri "$(webhook1)" `
        -Method Post `
        -ContentType "application/json" `
        -Body $body

  displayName: "⚔️ Batalha - ${{ parameters.environmentName }}"
