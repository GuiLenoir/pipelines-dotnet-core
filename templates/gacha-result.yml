parameters:

- name: environmentName
  type: string

- name: color
  type: string
  default: "3447003"

steps:

- powershell: |

    $galo1Nome = "$(galo1Nome)"
    $galo1Raridade = "$(galo1Raridade)"
    $galo1Hp = [int]"$(galo1Hp)"
    $galo1Ataque = [int]"$(galo1Ataque)"
    $galo1Defesa = [int]"$(galo1Defesa)"
    $galo1Velocidade = [int]"$(galo1Velocidade)"

    $galo2Nome = "$(galo2Nome)"
    $galo2Raridade = "$(galo2Raridade)"
    $galo2Hp = [int]"$(galo2Hp)"
    $galo2Ataque = [int]"$(galo2Ataque)"
    $galo2Defesa = [int]"$(galo2Defesa)"
    $galo2Velocidade = [int]"$(galo2Velocidade)"

    Write-Host ""
    Write-Host "========================================"
    Write-Host "          BATALHA DA RINHA"
    Write-Host "========================================"

    Write-Host ""
    Write-Host "GALO 1"
    Write-Host "Nome: $galo1Nome"
    Write-Host "Raridade: $galo1Raridade"
    Write-Host "HP: $galo1Hp"
    Write-Host "Ataque: $galo1Ataque"
    Write-Host "Defesa: $galo1Defesa"
    Write-Host "Velocidade: $galo1Velocidade"

    Write-Host ""
    Write-Host "GALO 2"
    Write-Host "Nome: $galo2Nome"
    Write-Host "Raridade: $galo2Raridade"
    Write-Host "HP: $galo2Hp"
    Write-Host "Ataque: $galo2Ataque"
    Write-Host "Defesa: $galo2Defesa"
    Write-Host "Velocidade: $galo2Velocidade"

    $hp1 = $galo1Hp
    $hp2 = $galo2Hp

    $round = 1
    $rounds = @()

    while ($hp1 -gt 0 -and $hp2 -gt 0 -and $round -le 20) {

        Write-Host ""
        Write-Host "========== ROUND $round =========="

        if ($galo1Velocidade -ge $galo2Velocidade) {

            $dano = $galo1Ataque - [math]::Floor($galo2Defesa / 2)

            if ($dano -lt 1) {
                $dano = 1
            }

            $critico = Get-Random -Minimum 1 -Maximum 101

            if ($critico -le 20) {
                $dano = $dano * 2
                $rounds += "Round $round - $galo1Nome acertou CRITICO causando $dano de dano"
            }
            else {
                $rounds += "Round $round - $galo1Nome causou $dano de dano"
            }

            $hp2 -= $dano

            Write-Host "$galo1Nome causou $dano de dano"

            if ($hp2 -le 0) {
                break
            }

            $dano = $galo2Ataque - [math]::Floor($galo1Defesa / 2)

            if ($dano -lt 1) {
                $dano = 1
            }

            $critico = Get-Random -Minimum 1 -Maximum 101

            if ($critico -le 20) {
                $dano = $dano * 2
                $rounds += "Round $round - $galo2Nome acertou CRITICO causando $dano de dano"
            }
            else {
                $rounds += "Round $round - $galo2Nome causou $dano de dano"
            }

            $hp1 -= $dano

            Write-Host "$galo2Nome causou $dano de dano"
        }
        else {

            $dano = $galo2Ataque - [math]::Floor($galo1Defesa / 2)

            if ($dano -lt 1) {
                $dano = 1
            }

            $critico = Get-Random -Minimum 1 -Maximum 101

            if ($critico -le 20) {
                $dano = $dano * 2
                $rounds += "Round $round - $galo2Nome acertou CRITICO causando $dano de dano"
            }
            else {
                $rounds += "Round $round - $galo2Nome causou $dano de dano"
            }

            $hp1 -= $dano

            Write-Host "$galo2Nome causou $dano de dano"

            if ($hp1 -le 0) {
                break
            }

            $dano = $galo1Ataque - [math]::Floor($galo2Defesa / 2)

            if ($dano -lt 1) {
                $dano = 1
            }

            $critico = Get-Random -Minimum 1 -Maximum 101

            if ($critico -le 20) {
                $dano = $dano * 2
                $rounds += "Round $round - $galo1Nome acertou CRITICO causando $dano de dano"
            }
            else {
                $rounds += "Round $round - $galo1Nome causou $dano de dano"
            }

            $hp2 -= $dano

            Write-Host "$galo1Nome causou $dano de dano"
        }

        $round++
    }

    if ($hp1 -gt 0 -and $hp2 -le 0) {

        $winner = $galo1Nome
        $winnerRarity = $galo1Raridade
        $winnerHp = $hp1
    }
    elseif ($hp2 -gt 0 -and $hp1 -le 0) {

        $winner = $galo2Nome
        $winnerRarity = $galo2Raridade
        $winnerHp = $hp2
    }
    else {

        if ($hp1 -ge $hp2) {
            $winner = $galo1Nome
            $winnerRarity = $galo1Raridade
            $winnerHp = $hp1
        }
        else {
            $winner = $galo2Nome
            $winnerRarity = $galo2Raridade
            $winnerHp = $hp2
        }
    }

    Write-Host ""
    Write-Host "========================================"
    Write-Host "              VENCEDOR"
    Write-Host "========================================"
    Write-Host ""
    Write-Host "Galo: $winner"
    Write-Host "Raridade: $winnerRarity"
    Write-Host "HP restante: $winnerHp"

    $battleText = ""

    foreach ($item in $rounds) {
        $battleText += "$item`n"
    }

    $message = @"
ROLETA DA RINHA - ${{ parameters.environmentName }}

GALO 1
Nome: $galo1Nome
Raridade: $galo1Raridade
HP: $galo1Hp
Ataque: $galo1Ataque
Defesa: $galo1Defesa
Velocidade: $galo1Velocidade

VS

GALO 2
Nome: $galo2Nome
Raridade: $galo2Raridade
HP: $galo2Hp
Ataque: $galo2Ataque
Defesa: $galo2Defesa
Velocidade: $galo2Velocidade

LUTA

$battleText

VENCEDOR

$winner
Raridade: $winnerRarity
HP restante: $winnerHp

Fim da luta!
"@

    $body = @{
        content = $message
    } | ConvertTo-Json

    Invoke-RestMethod `
      -Uri "$(webhook1)" `
      -Method Post `
      -ContentType "application/json" `
      -Body $body

  displayName: "Batalha - ${{ parameters.environmentName }}"
