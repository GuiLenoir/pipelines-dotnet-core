parameters:
- name: environmentName
  type: string

- name: color
  type: string
  default: "3447003"

steps:
- powershell: |
    $galo1Nome = "$(galo1Nome)"
    $galo1Raridade = "$(galo1Raridade)"
    $galo1Hp = [int]"$(galo1Hp)"
    $galo1Ataque = [int]"$(galo1Ataque)"
    $galo1Defesa = [int]"$(galo1Defesa)"
    $galo1Velocidade = [int]"$(galo1Velocidade)"

    $galo2Nome = "$(galo2Nome)"
    $galo2Raridade = "$(galo2Raridade)"
    $galo2Hp = [int]"$(galo2Hp)"
    $galo2Ataque = [int]"$(galo2Ataque)"
    $galo2Defesa = [int]"$(galo2Defesa)"
    $galo2Velocidade = [int]"$(galo2Velocidade)"

    $hp1 = $galo1Hp
    $hp2 = $galo2Hp

    $round = 1
    $rounds = @()

    Write-Host ""
    Write-Host "========================================"
    Write-Host "             BATALHA"
    Write-Host "========================================"

    while ($hp1 -gt 0 -and $hp2 -gt 0 -and $round -le 20) {

        Write-Host ""
        Write-Host "ROUND $round"

        if ($galo1Velocidade -ge $galo2Velocidade) {
            $primeiro = 1
        }
        else {
            $primeiro = 2
        }

        if ($primeiro -eq 1) {

            $dano = $galo1Ataque - [math]::Floor($galo2Defesa / 2)

            if ($dano -lt 1) {
                $dano = 1
            }

            $critico = Get-Random -Minimum 1 -Maximum 101

            if ($critico -le 20) {
                $dano = $dano * 2
                $rounds += "Round $round - $galo1Nome acertou CRITICO causando $dano de dano."
            }
            else {
                $rounds += "Round $round - $galo1Nome causou $dano de dano."
            }

            $hp2 -= $dano

            Write-Host "$galo1Nome causou $dano de dano."

            if ($hp2 -le 0) {
                break
            }

            $dano = $galo2Ataque - [math]::Floor($galo1Defesa / 2)

            if ($dano -lt 1) {
                $dano = 1
            }

            $critico = Get-Random -Minimum 1 -Maximum 101

            if ($critico -le 20) {
                $dano = $dano * 2
                $rounds += "Round $round - $galo2Nome acertou CRITICO causando $dano de dano."
            }
            else {
                $rounds += "Round $round - $galo2Nome causou $dano de dano."
            }

            $hp1 -= $dano

            Write-Host "$galo2Nome causou $dano de dano."
        }
        else {

            $dano = $galo2Ataque - [math]::Floor($galo1Defesa / 2)

            if ($dano -lt 1) {
                $dano = 1
            }

            $critico = Get-Random -Minimum 1 -Maximum 101

            if ($critico -le 20) {
                $dano = $dano * 2
                $rounds += "Round $round - $galo2Nome acertou CRITICO causando $dano de dano."
            }
            else {
                $rounds += "Round $round - $galo2Nome causou $dano de dano."
            }

            $hp1 -= $dano

            Write-Host "$galo2Nome causou $dano de dano."

            if ($hp1 -le 0) {
                break
            }

            $dano = $galo1Ataque - [math]::Floor($galo2Defesa / 2)

            if ($dano -lt 1) {
                $dano = 1
            }

            $critico = Get-Random -Minimum 1 -Maximum 101

            if ($critico -le 20) {
                $dano = $dano * 2
                $rounds += "Round $round - $galo1Nome acertou CRITICO causando $dano de dano."
            }
            else {
                $rounds += "Round $round - $galo1Nome causou $dano de dano."
            }

            $hp2 -= $dano

            Write-Host "$galo1Nome causou $dano de dano."
        }

        $round++
    }

    if ($hp1 -gt 0 -and $hp2 -le 0) {
        $winner = $galo1Nome
        $winnerRarity = $galo1Raridade
        $winnerHp = $hp1
    }
    elseif ($hp2 -gt 0 -and $hp1 -le 0) {
        $winner = $galo2Nome
        $winnerRarity = $galo2Raridade
        $winnerHp = $hp2
    }
    else {
        if ($hp1 -ge $hp2) {
            $winner = $galo1Nome
            $winnerRarity = $galo1Raridade
            $winnerHp = $hp1
        }
        else {
            $winner = $galo2Nome
            $winnerRarity = $galo2Raridade
            $winnerHp = $hp2
        }
    }

    Write-Host ""
    Write-Host "========================================"
    Write-Host "              VENCEDOR"
    Write-Host "========================================"
    Write-Host ""
    Write-Host "Nome: $winner"
    Write-Host "Raridade: $winnerRarity"
    Write-Host "HP restante: $winnerHp"
    Write-Host ""

    $battleText = ""

    foreach ($item in $rounds) {
        $battleText = $battleText + $item + "`n"
    }

    $message = "ROLETA DA RINHA - ${{ parameters.environmentName }}`n`n"
    $message = $message + "========================================`n`n"

    $message = $message + "GALO 1`n"
    $message = $message + "Nome: $galo1Nome`n"
    $message = $message + "Raridade: $galo1Raridade`n"
    $message = $message + "HP: $galo1Hp`n"
    $message = $message + "ATK: $galo1Ataque`n"
    $message = $message + "DEF: $galo1Defesa`n"
    $message = $message + "SPD: $galo1Velocidade`n`n"

    $message = $message + "========================================`n`n"

    $message = $message + "GALO 2`n"
    $message = $message + "Nome: $galo2Nome`n"
    $message = $message + "Raridade: $galo2Raridade`n"
    $message = $message + "HP: $galo2Hp`n"
    $message = $message + "ATK: $galo2Ataque`n"
    $message = $message + "DEF: $galo2Defesa`n"
    $message = $message + "SPD: $galo2Velocidade`n`n"

    $message = $message + "========================================`n`n"
    $message = $message + "A LUTA COMECou!`n`n"
    $message = $message + $battleText
    $message = $message + "`n========================================`n`n"

    $message = $message + "VENCEDOR`n`n"
    $message = $message + $winner
    $message = $message + "`nRaridade: " + $winnerRarity
    $message = $message + "`nHP restante: " + $winnerHp
    $message = $message + "`n`nFim da luta!"

    $body = @{
        content = $message
    } | ConvertTo-Json

    Invoke-RestMethod `
      -Uri "$(webhook1)" `
      -Method Post `
      -ContentType "application/json" `
      -Body $body

  displayName: "Batalha - ${{ parameters.environmentName }}"
