parameters:

- name: environmentName
  type: string

- name: color
  type: string
  default: "3447003"

steps:

- powershell: |

    # ========================================================
    # DADOS
    # ========================================================

    $environmentName = "${{ parameters.environmentName }}"

    $rarity = "$(gachaRarity)"
    $character = "$(gachaCharacter)"
    $roll = "$(gachaRoll)"
    $emoji = "$(gachaEmoji)"

    $color = [int]${{ parameters.color }}


    # ========================================================
    # DISCORD EMBED
    # ========================================================

    $embed = @{
        title = "🎰 ROLETA DA RINHA DE GALO"

        description = "Resultado do sorteio"

        color = $color

        fields = @(
            @{
                name = "🏟️ Ambiente"
                value = "**$environmentName**"
                inline = $true
            }

            @{
                name = "🎲 Roll"
                value = "**$roll**"
                inline = $true
            }

            @{
                name = "$emoji Raridade"
                value = "**$rarity**"
                inline = $true
            }

            @{
                name = "🐓 Galo"
                value = "**$character**"
                inline = $false
            }
        )

        footer = @{
            text = "Roleta da Rinha • Azure Pipelines"
        }
    }


    # ========================================================
    # PAYLOAD
    # ========================================================

    $body = @{
        embeds = @($embed)
    } | ConvertTo-Json -Depth 10


    # ========================================================
    # DISCORD
    # ========================================================

    Invoke-RestMethod `
        -Uri "$(webhook1)" `
        -Method Post `
        -ContentType "application/json" `
        -Body $body

  displayName: "Discord - Resultado ${{ parameters.environmentName }}"
