steps:

- powershell: |

    # ========================================================
    # GALOS
    # ========================================================

    $characters = @{

        Common = @(
            "Galo da Fazenda do seu Zé",
            "Galo Periculoso",
            "Galo Idoso"
        )

        Uncommon = @(
            "Galo Cafetão",
            "Galo Doido",
            "Galo Psicopata"
        )

        Rare = @(
            "Galo de Rinha Tradicional",
            "Galo 2077"
        )

        Epic = @(
            "Galo Voador",
            "Galo de 4 Patas"
        )

        Legendary = @(
            "Galo CJ"
        )
    }

    function Gerar-Galo {

        $roll = Get-Random -Minimum 1 -Maximum 101

        if ($roll -le 60) {
            $raridade = "Common"
        }
        elseif ($roll -le 85) {
            $raridade = "Uncommon"
        }
        elseif ($roll -le 95) {
            $raridade = "Rare"
        }
        elseif ($roll -le 99) {
            $raridade = "Epic"
        }
        else {
            $raridade = "Legendary"
        }

        $nome = Get-Random -InputObject $characters[$raridade]

        switch ($raridade) {

            "Common" {
                $hp = Get-Random -Minimum 80 -Maximum 101
                $ataque = Get-Random -Minimum 20 -Maximum 41
                $defesa = Get-Random -Minimum 20 -Maximum 41
                $velocidade = Get-Random -Minimum 20 -Maximum 41
            }

            "Uncommon" {
                $hp = Get-Random -Minimum 90 -Maximum 111
                $ataque = Get-Random -Minimum 35 -Maximum 56
                $defesa = Get-Random -Minimum 30 -Maximum 51
                $velocidade = Get-Random -Minimum 30 -Maximum 51
            }

            "Rare" {
                $hp = Get-Random -Minimum 100 -Maximum 121
                $ataque = Get-Random -Minimum 50 -Maximum 71
                $defesa = Get-Random -Minimum 40 -Maximum 61
                $velocidade = Get-Random -Minimum 40 -Maximum 61
            }

            "Epic" {
                $hp = Get-Random -Minimum 110 -Maximum 131
                $ataque = Get-Random -Minimum 65 -Maximum 86
                $defesa = Get-Random -Minimum 50 -Maximum 71
                $velocidade = Get-Random -Minimum 50 -Maximum 71
            }

            "Legendary" {
                $hp = Get-Random -Minimum 120 -Maximum 151
                $ataque = Get-Random -Minimum 80 -Maximum 101
                $defesa = Get-Random -Minimum 60 -Maximum 81
                $velocidade = Get-Random -Minimum 60 -Maximum 81
            }
        }

        return @{
            Nome = $nome
            Raridade = $raridade
            Hp = $hp
            Ataque = $ataque
            Defesa = $defesa
            Velocidade = $velocidade
        }
    }

    # ========================================================
    # GERAR GALOS
    # ========================================================

    $galo1 = Gerar-Galo
    $galo2 = Gerar-Galo

    Write-Host ""
    Write-Host "========================================"
    Write-Host "          GALOS SORTEADOS"
    Write-Host "========================================"

    Write-Host ""
    Write-Host "GALO 1"
    Write-Host "Nome: $($galo1.Nome)"
    Write-Host "Raridade: $($galo1.Raridade)"
    Write-Host "HP: $($galo1.Hp)"
    Write-Host "Ataque: $($galo1.Ataque)"
    Write-Host "Defesa: $($galo1.Defesa)"
    Write-Host "Velocidade: $($galo1.Velocidade)"

    Write-Host ""
    Write-Host "GALO 2"
    Write-Host "Nome: $($galo2.Nome)"
    Write-Host "Raridade: $($galo2.Raridade)"
    Write-Host "HP: $($galo2.Hp)"
    Write-Host "Ataque: $($galo2.Ataque)"
    Write-Host "Defesa: $($galo2.Defesa)"
    Write-Host "Velocidade: $($galo2.Velocidade)"

    # ========================================================
    # VARIÁVEIS DO PIPELINE
    # ========================================================

    Write-Host "##vso[task.setvariable variable=galo1Nome]$($galo1.Nome)"
    Write-Host "##vso[task.setvariable variable=galo1Raridade]$($galo1.Raridade)"
    Write-Host "##vso[task.setvariable variable=galo1Hp]$($galo1.Hp)"
    Write-Host "##vso[task.setvariable variable=galo1Ataque]$($galo1.Ataque)"
    Write-Host "##vso[task.setvariable variable=galo1Defesa]$($galo1.Defesa)"
    Write-Host "##vso[task.setvariable variable=galo1Velocidade]$($galo1.Velocidade)"

    Write-Host "##vso[task.setvariable variable=galo2Nome]$($galo2.Nome)"
    Write-Host "##vso[task.setvariable variable=galo2Raridade]$($galo2.Raridade)"
    Write-Host "##vso[task.setvariable variable=galo2Hp]$($galo2.Hp)"
    Write-Host "##vso[task.setvariable variable=galo2Ataque]$($galo2.Ataque)"
    Write-Host "##vso[task.setvariable variable=galo2Defesa]$($galo2.Defesa)"
    Write-Host "##vso[task.setvariable variable=galo2Velocidade]$($galo2.Velocidade)"

  displayName: "🎰 Sortear dois galos"
