parameters:

- name: message
  type: string

- name: displayName
  type: string
  default: "Discord Notification"

steps:

- powershell: |

    $message = @'
${{ parameters.message }}
'@

    $body = @{
        content = $message
    } | ConvertTo-Json

    Invoke-RestMethod `
        -Uri "$(webhook1)" `
        -Method Post `
        -ContentType "application/json" `
        -Body $body

  displayName: "${{ parameters.displayName }}"
