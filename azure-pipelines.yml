trigger:
- master

variables:
- group: discord-secrets

pool:
  vmImage: ubuntu-latest

stages:

# ============================================================
# DEV
# ============================================================

- stage: DEV
  displayName: "🔵 Deploy DEV"

  jobs:

  - deployment: DeployDEV
    displayName: "Deploy DEV"

    environment: dev

    strategy:
      runOnce:
        deploy:

          steps:

          # ----------------------------------------
          # Discord - início
          # ----------------------------------------

          - powershell: |
              $body = @{
                content = "🔵 DEV - Deploy iniciado"
              } | ConvertTo-Json

              Invoke-RestMethod `
                -Uri "$(webhook1)" `
                -Method Post `
                -ContentType "application/json" `
                -Body $body

            displayName: "Discord - DEV iniciado"


          # ----------------------------------------
          # Deploy DEV
          # ----------------------------------------

          - script: |
              echo "================================="
              echo "Executando deploy DEV..."
              echo "================================="

              sleep 5

            displayName: "Executar deploy DEV"


          # ----------------------------------------
          # Discord - sucesso
          # ----------------------------------------

          - powershell: |
              $body = @{
                content = "🟢 DEV - Deploy finalizado com sucesso"
              } | ConvertTo-Json

              Invoke-RestMethod `
                -Uri "$(webhook1)" `
                -Method Post `
                -ContentType "application/json" `
                -Body $body

            displayName: "Discord - DEV finalizado"


# ============================================================
# HOMOLOG
# ============================================================

- stage: HOMOLOG
