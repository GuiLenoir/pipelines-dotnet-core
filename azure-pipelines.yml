trigger:
- master

variables:
- group: discord-secrets

pool:
  vmImage: ubuntu-latest

stages:

# ============================================================
# DEV
# ============================================================

- stage: DEV
  displayName: "🔵 Deploy DEV"

  jobs:

  - deployment: DeployDEV
    displayName: "Deploy DEV"

    environment: dev

    strategy:
      runOnce:
        deploy:

          steps:

          # Discord - início
          - powershell: |
              $body = @{
                content = "🔵 DEV - Deploy iniciado"
              } | ConvertTo-Json

              Invoke-RestMethod `
                -Uri "$(webhook1)" `
                -Method Post `
                -ContentType "application/json" `
                -Body $body

            displayName: "Discord - DEV iniciado"


          # Deploy
          - script: |
              echo "================================="
              echo "Executando deploy DEV..."
              echo "================================="

              sleep 5

            displayName: "Executar deploy DEV"


          # Discord - sucesso
          - powershell: |
              $body = @{
                content = "🟢 DEV - Deploy finalizado com sucesso"
              } | ConvertTo-Json

              Invoke-RestMethod `
                -Uri "$(webhook1)" `
                -Method Post `
                -ContentType "application/json" `
                -Body $body

            displayName: "Discord - DEV finalizado"


# ============================================================
# HOMOLOG
# ============================================================

- stage: HOMOLOG
  displayName: "🟡 Deploy HOMOLOG"

  dependsOn: DEV

  jobs:

  - deployment: DeployHOMOLOG
    displayName: "Deploy HOMOLOG"

    environment: homolog

    strategy:
      runOnce:
        deploy:

          steps:

          # Discord - início
          - powershell: |
              $body = @{
                content = "🟡 HOMOLOG - Deploy iniciado"
              } | ConvertTo-Json

              Invoke-RestMethod `
                -Uri "$(webhook1)" `
                -Method Post `
                -ContentType "application/json" `
                -Body $body

            displayName: "Discord - HOMOLOG iniciado"


          # ========================================
          # SIMULAÇÃO DE FALHA
          # ========================================

          - script: |
              echo "================================="
              echo "Executando deploy HOMOLOG..."
              echo "================================="

              echo "Simulando erro..."

              exit 1

            displayName: "💥 Simular falha HOMOLOG"


          # ========================================
          # Discord - falha
          # ========================================

          - powershell: |
              $body = @{
                content = "🔴 HOMOLOG - Deploy falhou!"
              } | ConvertTo-Json

              Invoke-RestMethod `
                -Uri "$(webhook1)" `
                -Method Post `
                -ContentType "application/json" `
                -Body $body

            condition: failed()
            displayName: "Discord - HOMOLOG falhou"


# ============================================================
# PROD
# ============================================================

- stage: PROD
  displayName: "🔴 Deploy PROD"

  dependsOn: HOMOLOG

  jobs:

  - deployment: DeployPROD
    displayName: "Deploy PROD"

    environment: prod

    strategy:
      runOnce:
        deploy:

          steps:

          # Discord - início
          - powershell: |
              $body = @{
                content = "🚀 PROD - Deploy autorizado e iniciado"
              } | ConvertTo-Json

              Invoke-RestMethod `
                -Uri "$(webhook1)" `
                -Method Post `
                -ContentType "application/json" `
                -Body $body

            displayName: "Discord - PROD iniciado"


          # Deploy
          - script: |
              echo "================================="
              echo "Executando deploy PROD..."
              echo "================================="

              sleep 5

            displayName: "Executar deploy PROD"


          # Discord - sucesso
          - powershell: |
              $body = @{
                content = "✅ PROD - Deploy finalizado com sucesso"
              } | ConvertTo-Json

              Invoke-RestMethod `
                -Uri "$(webhook1)" `
                -Method Post `
                -ContentType "application/json" `
                -Body $body

            displayName: "Discord - PROD finalizado"
