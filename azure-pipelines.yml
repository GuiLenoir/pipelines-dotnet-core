            displayName: "Discord - HOMOLOG iniciado"


          # ----------------------------------------
          # Deploy HOMOLOG
          # ----------------------------------------

          - script: |
              echo "================================="
              echo "Executando deploy HOMOLOG..."
              echo "================================="

              sleep 5

            displayName: "Executar deploy HOMOLOG"


          # ----------------------------------------
          # Discord - sucesso
          # ----------------------------------------

          - powershell: |
              $body = @{
                content = "🟢 HOMOLOG - Deploy finalizado com sucesso"
              } | ConvertTo-Json

              Invoke-RestMethod `
