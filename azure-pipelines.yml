trigger:
- master

variables:
- group: discord-secrets

pool:
  vmImage: windows-latest

stages:

- stage: environmentDEV
  displayName: 'environment de desenvolvimento'

  jobs:
  - deployment: deployDEV
    environment: dev

    strategy:
      runOnce:
        deploy:
          steps:

          - script: echo Jarvis, iniciar pipeline...
            displayName: '1 writeline apenas'

          - script: |
              echo Jarvis iniciado.
              echo Jarvis preparando conecção
            displayName: 'Multiplos writeline'

          - powershell: |
              $body = @{
                content = ':burrito: Pipeline do jarvis finalizada com sucesso'
              } | ConvertTo-Json

              Invoke-RestMethod `
                -Uri "$(webhook1)" `
                -Method Post `
                -ContentType "application/json" `
                -Body $body
            displayName: 'Webhook do discord'
