trigger:
- master

variables:
- group: discord-secrets

pool:
  vmImage: ubuntu-latest

stages:

# ============================================================
# DEV
# ============================================================

- stage: DEV
  displayName: "🔵 Roleta DEV"

  jobs:

  - deployment: GachaDEV
    displayName: "🐓 Executar Roleta DEV"

    environment: dev

    strategy:
      runOnce:
        deploy:
          steps:

          # --------------------------------------------------
          # Checkout do repositório
          # --------------------------------------------------

          - checkout: self

          # --------------------------------------------------
          # Discord - início DEV
          # --------------------------------------------------

          - template: templates/discord-notification.yml
            parameters:
              message: "🔵 **DEV** | 🎰 Roleta iniciada!"
              displayName: "Discord - DEV iniciado"

          # --------------------------------------------------
          # .NET
          # --------------------------------------------------

          - task: UseDotNet@2
            displayName: "🟣 Instalar .NET"
            inputs:
              packageType: "sdk"
              version: "10.x"

          # --------------------------------------------------
          # Verificar arquivos
          # --------------------------------------------------

          - bash: |
              echo "===================================="
              echo "      VERIFICANDO REPOSITÓRIO"
              echo "===================================="

              echo ""
              echo "Diretório atual:"
              pwd

              echo ""
              echo "Build.SourcesDirectory:"
              echo "$(Build.SourcesDirectory)"

              echo ""
              echo "Conteúdo do projeto:"
              ls -la "$(Build.SourcesDirectory)/GaloRinha.Api"

              echo ""
              echo "Projeto .NET:"
              ls -la "$(Build.SourcesDirectory)/GaloRinha.Api/"*.csproj

            displayName: "🔎 Verificar projeto"

          # --------------------------------------------------
          # .NET - Restore
          # --------------------------------------------------

          - bash: |
              dotnet restore "$(Build.SourcesDirectory)/GaloRinha.Api/GaloRinha.Api.csproj"
            displayName: "📦 Restaurar dependências"

          # --------------------------------------------------
          # .NET - Build
          # --------------------------------------------------

          - bash: |
              dotnet build "$(Build.SourcesDirectory)/GaloRinha.Api/GaloRinha.Api.csproj" \
                --configuration Release \
                --no-restore
            displayName: "🔨 Compilar API"

          # --------------------------------------------------
          # Gacha
          # --------------------------------------------------

          - template: templates/gacha.yml

          # --------------------------------------------------
          # Discord - resultado DEV
          # --------------------------------------------------

          - template: templates/gacha-result.yml
            parameters:
              environmentName: "DEV"
              color: 3447003


# ============================================================
# HOMOLOG
# ============================================================

- stage: HOMOLOG
  displayName: "🟡 Roleta HOMOLOG"

  dependsOn: DEV

  jobs:

  - deployment: GachaHOMOLOG
    displayName: "🐓 Validar Roleta HOMOLOG"

    environment: homolog

    strategy:
      runOnce:
        deploy:
          steps:

          # --------------------------------------------------
          # Checkout do repositório
          # --------------------------------------------------

          - checkout: self

          # --------------------------------------------------
          # Discord - início HOMOLOG
          # --------------------------------------------------

          - template: templates/discord-notification.yml
            parameters:
              message: "🟡 **HOMOLOG** | 🔍 Validação da roleta iniciada!"
              displayName: "Discord - HOMOLOG iniciado"

          # --------------------------------------------------
          # .NET
          # --------------------------------------------------

          - task: UseDotNet@2
            displayName: "🟣 Instalar .NET"
            inputs:
              packageType: "sdk"
              version: "10.x"

          # --------------------------------------------------
          # Build
          # --------------------------------------------------

          - bash: |
              dotnet restore "$(Build.SourcesDirectory)/GaloRinha.Api/GaloRinha.Api.csproj"
            displayName: "📦 Restaurar dependências"

          - bash: |
              dotnet build "$(Build.SourcesDirectory)/GaloRinha.Api/GaloRinha.Api.csproj" \
                --configuration Release \
                --no-restore
            displayName: "🔨 Compilar API"

          # --------------------------------------------------
          # Validação da roleta
          # --------------------------------------------------

          - powershell: |

              Write-Host "===================================="
              Write-Host "     VALIDANDO ROLETA HOMOLOG"
              Write-Host "===================================="

              $common = 60
              $uncommon = 25
              $rare = 10
              $epic = 4
              $legendary = 1

              $total = `
                $common + `
                $uncommon + `
                $rare + `
                $epic + `
                $legendary

              Write-Host ""
              Write-Host "Common:     $common%"
              Write-Host "Uncommon:   $uncommon%"
              Write-Host "Rare:       $rare%"
              Write-Host "Epic:       $epic%"
              Write-Host "Legendary:  $legendary%"
              Write-Host ""
              Write-Host "Total:      $total%"
              Write-Host ""

              if ($total -ne 100) {

                Write-Error "As probabilidades não totalizam 100%."

                exit 1
              }

              Write-Host "Probabilidades válidas!"
              Write-Host "Roleta HOMOLOG aprovada!"

            displayName: "🔍 Validar probabilidades"

          # --------------------------------------------------
          # Discord - sucesso HOMOLOG
          # --------------------------------------------------

          - template: templates/discord-notification.yml
            parameters:
              message: "🟢 **HOMOLOG** | ✅ Validação concluída com sucesso!"
              displayName: "Discord - HOMOLOG aprovado"


# ============================================================
# PROD
# ============================================================

- stage: PROD
  displayName: "🔴 Roleta PROD"

  dependsOn: HOMOLOG

  jobs:

  - deployment: GachaPROD
    displayName: "🐓 Executar Roleta PROD"

    environment: prod

    strategy:
      runOnce:
        deploy:
          steps:

          # --------------------------------------------------
          # Checkout do repositório
          # --------------------------------------------------

          - checkout: self

          # --------------------------------------------------
          # Discord - início PROD
          # --------------------------------------------------

          - template: templates/discord-notification.yml
            parameters:
              message: "🔴 **PROD** | 🚀 PRODUÇÃO INICIADA!"
              displayName: "Discord - PROD iniciado"

          # --------------------------------------------------
          # .NET
          # --------------------------------------------------

          - task: UseDotNet@2
            displayName: "🟣 Instalar .NET"
            inputs:
              packageType: "sdk"
              version: "10.x"

          # --------------------------------------------------
          # Build
          # --------------------------------------------------

          - bash: |
              dotnet restore "$(Build.SourcesDirectory)/GaloRinha.Api/GaloRinha.Api.csproj"
            displayName: "📦 Restaurar dependências"

          - bash: |
              dotnet build "$(Build.SourcesDirectory)/GaloRinha.Api/GaloRinha.Api.csproj" \
                --configuration Release \
                --no-restore
            displayName: "🔨 Compilar API"

          # --------------------------------------------------
          # Gacha
          # --------------------------------------------------

          - template: templates/gacha.yml

          # --------------------------------------------------
          # Discord - resultado PROD
          # --------------------------------------------------

          - template: templates/gacha-result.yml
            parameters:
              environmentName: "PROD"
              color: 15158332