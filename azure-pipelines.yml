trigger:
- master

variables:
- group: discord-secrets

pool:
  vmImage: ubuntu-latest

stages:

# ============================================================
# DEV
# ============================================================

- stage: DEV
  displayName: "🔵 Gacha DEV"

  jobs:

  - deployment: GachaDEV
    displayName: "🎰 Executar Gacha DEV"

    environment: dev

    strategy:
      runOnce:
        deploy:

          steps:

          # --------------------------------------------------
          # Discord - início
          # --------------------------------------------------

          - powershell: |
              $body = @{
                content = "🔵 **Roleta da Rinha de Galo** - Sorteio iniciado! 🎰"
              } | ConvertTo-Json

              Invoke-RestMethod `
                -Uri "$(webhook1)" `
                -Method Post `
                -ContentType "application/json" `
                -Body $body

            displayName: "Discord - Gacha DEV iniciado"


          # --------------------------------------------------
          # Gacha
          # --------------------------------------------------

          - powershell: |

              # ==============================================
              # TABELA DE PERSONAGENS
              # ==============================================

              $characters = @{
                  Common = @(
                      "Galo da Fazenda do seu Zé",
                      "Galo Periculoso",
                      "Galo Idoso"
                  )

                  Uncommon = @(
                      "Galo Cafetão",
                      "Galo Doido",
                      "Galo Psicopata"
                  )

                  Rare = @(
                      "Galo de Rinha Tradicional",
                      "Galo 2077"
                  )

                  Epic = @(
                      "Galo Voador",
                      "Galo de 4 Patas"
                  )

                  Legendary = @(
                      "Galo CJ"
                  )
              }


              # ==============================================
              # SORTEIO DA RARIDADE
              # ==============================================

              $roll = Get-Random -Minimum 1 -Maximum 101

              Write-Host "Número sorteado: $roll"


              if ($roll -le 60) {

                  $rarity = "Common"

              }
              elseif ($roll -le 85) {

                  $rarity = "Uncommon"

              }
              elseif ($roll -le 95) {

                  $rarity = "Rare"

              }
              elseif ($roll -le 99) {

                  $rarity = "Epic"

              }
              else {

                  $rarity = "Legendary"

              }


              # ==============================================
              # ESCOLHER PERSONAGEM
              # ==============================================

              $character = Get-Random -InputObject $characters[$rarity]


              # ==============================================
              # EMOJIS
              # ==============================================

              switch ($rarity) {

                  "Common" {
                      $emoji = "⚪"
                  }

                  "Uncommon" {
                      $emoji = "🟢"
                  }

                  "Rare" {
                      $emoji = "🔵"
                  }

                  "Epic" {
                      $emoji = "🟣"
                  }

                  "Legendary" {
                      $emoji = "🟡"
                  }

              }


              # ==============================================
              # MOSTRAR NO LOG
              # ==============================================

              Write-Host ""
              Write-Host "===================================="
              Write-Host "          RESULTADO ROLETA"
              Write-Host "===================================="
              Write-Host "Roll: $roll"
              Write-Host "Rarity: $rarity"
              Write-Host "Character: $character"
              Write-Host "===================================="
              Write-Host ""


              # ==============================================
              # GUARDAR RESULTADO COMO VARIÁVEIS DA PIPELINE
              # ==============================================

              Write-Host "##vso[task.setvariable variable=gachaRarity]$rarity"
              Write-Host "##vso[task.setvariable variable=gachaCharacter]$character"
              Write-Host "##vso[task.setvariable variable=gachaRoll]$roll"

            displayName: "🎰 Executar Gacha DEV"


          # --------------------------------------------------
          # Discord - resultado
          # --------------------------------------------------

          - powershell: |

              $rarity = "$(gachaRarity)"
              $character = "$(gachaCharacter)"
              $roll = "$(gachaRoll)"

              switch ($rarity) {

                  "Common" {
                      $emoji = "⚪"
                  }

                  "Uncommon" {
                      $emoji = "🟢"
                  }

                  "Rare" {
                      $emoji = "🔵"
                  }

                  "Epic" {
                      $emoji = "🟣"
                  }

                  "Legendary" {
                      $emoji = "🟡"
                  }

              }

              $message = @"
              🎰 **GACHA DEV**

              🎲 Roll: **$roll**

              $emoji Raridade: **$rarity**
              ✨ Personagem: **$character**

              _Gacha executado com sucesso!_
              "@

              $body = @{
                content = $message
              } | ConvertTo-Json

              Invoke-RestMethod `
                -Uri "$(webhook1)" `
                -Method Post `
                -ContentType "application/json" `
                -Body $body

            displayName: "Discord - Resultado DEV"


# ============================================================
# HOMOLOG
# ============================================================

- stage: HOMOLOG
  displayName: "🟡 Gacha HOMOLOG"

  dependsOn: DEV

  jobs:

  - deployment: GachaHOMOLOG
    displayName: "🎰 Executar Gacha HOMOLOG"

    environment: homolog

    strategy:
      runOnce:
        deploy:

          steps:

          # --------------------------------------------------
          # Discord - início
          # --------------------------------------------------

          - powershell: |

              $body = @{
                content = "🟡 **GACHA HOMOLOG** - Validação iniciada! 🎰"
              } | ConvertTo-Json

              Invoke-RestMethod `
                -Uri "$(webhook1)" `
                -Method Post `
                -ContentType "application/json" `
                -Body $body

            displayName: "Discord - Gacha HOMOLOG iniciado"


          # --------------------------------------------------
          # Validação
          # --------------------------------------------------

          - powershell: |

              Write-Host "===================================="
              Write-Host "     VALIDANDO GACHA HOMOLOG"
              Write-Host "===================================="

              Write-Host ""
              Write-Host "Common:     60%"
              Write-Host "Uncommon:   25%"
              Write-Host "Rare:       10%"
              Write-Host "Epic:        4%"
              Write-Host "Legendary:  1%"
              Write-Host ""

              $total = 60 + 25 + 10 + 4 + 1

              Write-Host "Total: $total%"

              if ($total -ne 100) {

                  Write-Error "As probabilidades não totalizam 100%."

                  exit 1
              }

              Write-Host "Probabilidades válidas!"
              Write-Host "Gacha HOMOLOG aprovado."

            displayName: "Validar probabilidades"


          # --------------------------------------------------
          # Discord - sucesso
          # --------------------------------------------------

          - powershell: |

              $body = @{
                content = "🟢 **GACHA HOMOLOG** - Validação concluída com sucesso! ✅"
              } | ConvertTo-Json

              Invoke-RestMethod `
                -Uri "$(webhook1)" `
                -Method Post `
                -ContentType "application/json" `
                -Body $body

            displayName: "Discord - HOMOLOG aprovado"


