# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- master

variables:
- group: discord-secrets

pool:
  vmImage: windows-latest

steps:
- script: echo Jarvis, iniciar pipeline...
  displayName: '1 writeline apenas'

- script: |
    echo Jarvis iniciado.
    echo Jarvis preparando conecção
  displayName: 'Multiplos writeline'

- powershell: |
    $body = @{
      content = ":burrito: Pipeline do jarvis finalizada com sucesso"
    } | ConvertTo-Json

    Invoke-RestMethod `
      -Uri "$(webhook1)" `
      -Method Post `
      -ContentType "application/json" `
      -Body $body
  displayName: "Webhook do discord"