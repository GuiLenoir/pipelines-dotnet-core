            displayName: "Discord - HOMOLOG finalizado"


# ============================================================
# PROD
# ============================================================

- stage: PROD
  displayName: "🔴 Deploy PROD"

  dependsOn: HOMOLOG

  jobs:

  - deployment: DeployPROD
    displayName: "Deploy PROD"

    environment: prod

    strategy:
      runOnce:
        deploy:

          steps:

          # ----------------------------------------
          # Discord - início
          # ----------------------------------------

          - powershell: |
              $body = @{
                content = "🚀 PROD - Deploy autorizado e iniciado"
              } | ConvertTo-Json

              Invoke-RestMethod `
                -Uri "$(webhook1)" `
