trigger:
- master

variables:
- group: discord-secrets

pool:
  vmImage: ubuntu-latest

stages:

# ========================================
# DEV
# ========================================

- stage: DEV
  displayName: "🔵 Deploy DEV"

  jobs:

  - deployment: DeployDEV
    displayName: "Deploy DEV"

    environment: dev

    strategy:
      runOnce:
        deploy:

          steps:

          - script: |
              echo "================================="
              echo "Deploy DEV iniciado"
              echo "================================="

            displayName: "Iniciar DEV"

          - powershell: |

              $body = @{
                content = "🔵 DEV - Deploy iniciado"
              } | ConvertTo-Json

              Invoke-RestMethod `
                -Uri "$(webhook1)" `
                -Method Post `
                -ContentType "application/json" `
                -Body $body

            displayName: "Discord - DEV"


# ========================================
# HOMOLOGAÇÃO
# ========================================
- stage: HOMOLOG
  displayName: "🟡 Deploy HOMOLOG"

  dependsOn: DEV

  jobs:

  - deployment: DeployHOMOLOG
    displayName: "Deploy HOMOLOG"

    environment: homolog

    strategy:
      runOnce:
        deploy:

          steps:

          - script: |
              echo "================================="
              echo "Deploy HOMOLOG iniciado"
              echo "================================="

            displayName: "Iniciar HOMOLOG"

          - powershell: |

              $body = @{
                content = "🟡 HOMOLOG - Deploy iniciado"
              } | ConvertTo-Json

              Invoke-RestMethod `
                -Uri "$(webhook1)" `
                -Method Post `
                -ContentType "application/json" `
                -Body $body

            displayName: "Discord - HOMOLOG"


# ========================================
# PRODUÇÃO
# ========================================
- stage: PROD
  displayName: "🔴 Deploy PROD"

  dependsOn: HOMOLOG

  jobs:

  - deployment: DeployPROD
    displayName: "Deploy PROD"

    environment: prod

    strategy:
      runOnce:
        deploy:

          steps:

          - script: |
              echo "================================="
              echo "Deploy PROD iniciado"
              echo "================================="

            displayName: "Iniciar PROD"

          - powershell: |

              $body = @{
                content = "🔴 PROD - Deploy iniciado"
              } | ConvertTo-Json

              Invoke-RestMethod `
                -Uri "$(webhook1)" `
                -Method Post `
                -ContentType "application/json" `
                -Body $body

            displayName: "Discord - PROD"

