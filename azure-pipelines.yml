trigger:
- master

variables:
- group: discord-secrets

pool:
  vmImage: ubuntu-latest

stages:

# ============================================================
# DEV
# ============================================================

- stage: DEV
  displayName: "Roleta DEV"

  jobs:

  - deployment: GachaDEV
    displayName: "Executar Roleta DEV"

    environment: dev

    strategy:
      runOnce:
        deploy:
          steps:

          # ==================================================
          # CHECKOUT
          # ==================================================

          - checkout: self
            displayName: "Baixar codigo"

          # ==================================================
          # DISCORD - INICIO
          # ==================================================

          - template: templates/discord-notification.yml
            parameters:
              message: "DEV | Roleta iniciada!"
              displayName: "Discord - DEV iniciado"

          # ==================================================
          # .NET
          # ==================================================

          - task: UseDotNet@2
            displayName: "Instalar .NET"
            inputs:
              packageType: "sdk"
              version: "10.x"

          - script: |
              echo "========================================"
              echo "DIRETORIO ATUAL"
              echo "========================================"
              pwd

              echo "========================================"
              echo "BUILD SOURCES"
              echo "========================================"
              echo "$(Build.SourcesDirectory)"

              echo "========================================"
              echo "ARQUIVOS"
              echo "========================================"
              ls -la "$(Build.SourcesDirectory)"

              echo "========================================"
              echo "GALO API"
              echo "========================================"
              ls -la "$(Build.SourcesDirectory)/GaloRinha.Api"

              echo "========================================"
              echo "CSPROJ"
              echo "========================================"
              ls -la "$(Build.SourcesDirectory)/GaloRinha.Api/"*.csproj
            displayName: "Verificar codigo"

          - script: |
              dotnet restore "$(Build.SourcesDirectory)/GaloRinha.Api/GaloRinha.Api.csproj"
            displayName: "Restaurar dependencias"

          - script: |
              dotnet build "$(Build.SourcesDirectory)/GaloRinha.Api/GaloRinha.Api.csproj" \
                --configuration Release \
                --no-restore
            displayName: "Compilar API"

          # ==================================================
          # GACHA
          # ==================================================

          - template: templates/gacha.yml

          # ==================================================
          # DISCORD - RESULTADO
          # ==================================================

          - template: templates/gacha-result.yml
            parameters:
              environmentName: "DEV"
              color: "3447003"


# ============================================================
# HOMOLOG
# ============================================================

- stage: HOMOLOG
  displayName: "Roleta HOMOLOG"

  dependsOn: DEV

  jobs:

  - deployment: GachaHOMOLOG
    displayName: "Validar Roleta HOMOLOG"

    environment: homolog

    strategy:
      runOnce:
        deploy:
          steps:

          # ==================================================
          # CHECKOUT
          # ==================================================

          - checkout: self
            displayName: "Baixar codigo"

          # ==================================================
          # DISCORD
          # ==================================================

          - template: templates/discord-notification.yml
            parameters:
              message: "HOMOLOG | Validacao da roleta iniciada!"
              displayName: "Discord - HOMOLOG iniciado"

          # ==================================================
          # VALIDACAO
          # ==================================================

          - powershell: |

              Write-Host "===================================="
              Write-Host "VALIDANDO ROLETA HOMOLOG"
              Write-Host "===================================="

              $common = 60
              $uncommon = 25
              $rare = 10
              $epic = 4
              $legendary = 1

              $total = `
                $common + `
                $uncommon + `
                $rare + `
                $epic + `
                $legendary

              Write-Host ""
              Write-Host "Common: $common%"
              Write-Host "Uncommon: $uncommon%"
              Write-Host "Rare: $rare%"
              Write-Host "Epic: $epic%"
              Write-Host "Legendary: $legendary%"
              Write-Host ""
              Write-Host "Total: $total%"
              Write-Host ""

              if ($total -ne 100) {

                Write-Error "As probabilidades nao totalizam 100%."

                exit 1
              }

              Write-Host "Probabilidades validas!"
              Write-Host "Roleta HOMOLOG aprovada!"

            displayName: "Validar probabilidades"

          # ==================================================
          # DISCORD
          # ==================================================

          - template: templates/discord-notification.yml
            parameters:
              message: "HOMOLOG | Validacao concluida com sucesso!"
              displayName: "Discord - HOMOLOG aprovado"


# ============================================================
# PROD
# ============================================================

- stage: PROD
  displayName: "Roleta PROD"

  dependsOn: HOMOLOG

  jobs:

  - deployment: GachaPROD
    displayName: "Executar Roleta PROD"

    environment: prod

    strategy:
      runOnce:
        deploy:
          steps:

          # ==================================================
          # CHECKOUT
          # ==================================================

          - checkout: self
            displayName: "Baixar codigo"

          # ==================================================
          # DISCORD
          # ==================================================

          - template: templates/discord-notification.yml
            parameters:
              message: "PROD | PRODUCAO INICIADA!"
              displayName: "Discord - PROD iniciado"

          # ==================================================
          # .NET
          # ==================================================

          - task: UseDotNet@2
            displayName: "Instalar .NET"
            inputs:
              packageType: "sdk"
              version: "10.x"

          - script: |
              dotnet restore "$(Build.SourcesDirectory)/GaloRinha.Api/GaloRinha.Api.csproj"
            displayName: "Restaurar dependencias"

          - script: |
              dotnet build "$(Build.SourcesDirectory)/GaloRinha.Api/GaloRinha.Api.csproj" \
                --configuration Release \
                --no-restore
            displayName: "Compilar API"

          # ==================================================
          # GACHA
          # ==================================================

          - template: templates/gacha.yml

          # ==================================================
          # DISCORD
          # ==================================================

          - template: templates/gacha-result.yml
            parameters:
              environmentName: "PROD"
              color: "15158332"
